<svg xmlns="http://www.w3.org/2000/svg" width="900" height="475" viewBox="0 0 900 475" role="img" aria-labelledby="title desc">
  <title id="title">借阅交接：核对后按三种状态处理</title>
  <desc id="desc">查目录，核对借出状态与实物。记录可借且实物在架时，登记借阅再交书。记录已借出但书在架上时，暂停交书并核对归还记录；记录可借但未找到实物时，暂停交书并查找位置与交接记录。</desc>
  <rect width="900" height="475" fill="#FFFFFF"/>
  <g font-family="Noto Sans SC, PingFang SC, sans-serif">
    <text x="35" y="40" font-size="24" font-weight="600" fill="#253B47">社区借书室 · 借阅流程</text>
    <text x="660" y="40" font-size="20" fill="#625E57">虚构场景 · 演示约定</text>
    <rect x="35" y="140" width="160" height="70" rx="35" fill="#EEF4F8" stroke="#6B91A8" stroke-width="2"/>
    <text x="115" y="184" text-anchor="middle" font-size="24" fill="#365B72">查目录</text>
    <polygon points="275,140 475,140 500,175 475,210 275,210 250,175" fill="#EEF4F8" stroke="#6B91A8" stroke-width="2"/>
    <text x="375" y="168" text-anchor="middle" font-size="23" fill="#365B72">核对借出状态</text>
    <text x="375" y="196" text-anchor="middle" font-size="23" fill="#365B72">与实物</text>
    <text x="540" y="96" text-anchor="middle" font-size="21" fill="#285B40">记录可借</text>
    <text x="540" y="123" text-anchor="middle" font-size="21" fill="#285B40">且实物在架</text>
    <rect x="580" y="140" width="140" height="70" rx="12" fill="#EDF6EF" stroke="#478363" stroke-width="2"/>
    <text x="650" y="184" text-anchor="middle" font-size="24" fill="#285B40">登记借阅</text>
    <rect x="770" y="140" width="95" height="70" rx="35" fill="#387957"/>
    <text x="817.5" y="184" text-anchor="middle" font-size="24" fill="#FFFFFF">交书</text>
    <path d="M195 175 H235" fill="none" stroke="#6B91A8" stroke-width="3"/>
    <polygon points="235,169 246,175 235,181" fill="#6B91A8"/>
    <path d="M500 175 H565 M720 175 H755" fill="none" stroke="#478363" stroke-width="3"/>
    <polygon points="565,169 576,175 565,181" fill="#478363"/>
    <polygon points="755,169 766,175 755,181" fill="#478363"/>
    <path d="M375 210 V265 M235 315 V265 H665 V315" fill="none" stroke="#BA514E" stroke-width="3"/>
    <polygon points="229,315 235,326 241,315" fill="#BA514E"/>
    <polygon points="659,315 665,326 671,315" fill="#BA514E"/>
    <rect x="40" y="330" width="390" height="120" rx="12" fill="#FCEDEC" stroke="#BA514E" stroke-width="2"/>
    <text x="235" y="364" text-anchor="middle" font-size="24" font-weight="600" fill="#A33E3B">记录冲突：暂停交书</text>
    <text x="235" y="398" text-anchor="middle" font-size="21" fill="#633E3C">记录已借出，但书在架上</text>
    <text x="235" y="431" text-anchor="middle" font-size="21" fill="#633E3C">核对是否漏记归还</text>
    <rect x="470" y="330" width="390" height="120" rx="12" fill="#FCEDEC" stroke="#BA514E" stroke-width="2"/>
    <text x="665" y="364" text-anchor="middle" font-size="24" font-weight="600" fill="#A33E3B">待查找：暂停交书</text>
    <text x="665" y="398" text-anchor="middle" font-size="21" fill="#633E3C">记录可借，但未找到实物</text>
    <text x="665" y="431" text-anchor="middle" font-size="21" fill="#633E3C">查找位置与最近交接记录</text>
  </g>
</svg>
